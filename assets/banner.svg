<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 360"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0f1d"/><stop offset="50%" stop-color="#0f172a"/><stop offset="100%" stop-color="#1e1b4b"/></linearGradient><linearGradient id="accentCyan" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#06b6d4"/><stop offset="100%" stop-color="#3b82f6"/></linearGradient><linearGradient id="accentPurple" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#ec4899"/></linearGradient><linearGradient id="glowGrad" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#38bdf8" stop-opacity=".25"/><stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/></linearGradient><filter id="cardShadow" width="140%" height="140%" x="-20%" y="-20%"><feDropShadow dx="0" dy="8" flood-color="#000" flood-opacity=".45" stdDeviation="12"/></filter><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes gridPulse{0%{opacity:.12}50%{opacity:.22}}@keyframes waveFloat{0%{transform:translateY(0) scaleY(1)}50%{transform:translateY(-8px) scaleY(1.05)}}@keyframes pulseNode{0%{r:4px;opacity:.4}50%{r:6px;opacity:.95}}@keyframes pillFloat1{0%{transform:translateY(0)}50%{transform:translateY(-5px)}}@keyframes pillFloat2{0%{transform:translateY(0)}50%{transform:translateY(5px)}}.badge-text,.subtitle-text,.title-text{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title-text{font-weight:800;fill:#fff;letter-spacing:-.5px}.subtitle-text{font-weight:400;fill:#94a3b8}.badge-text{font-size:11px;font-weight:600;fill:#e2e8f0;letter-spacing:.5px}.grid-mesh{animation:gridPulse 8s ease-in-out infinite}.actuarial-curve{animation:waveFloat 6s ease-in-out infinite;transform-origin:center bottom}.node-1{animation:pulseNode 3.5s ease-in-out infinite}.node-2{animation:pulseNode 4.2s ease-in-out infinite 1s}.node-3{animation:pulseNode 3s ease-in-out infinite 2s}.node-4{animation:pulseNode 5s ease-in-out infinite 1.5s}.pill-1{animation:pillFloat1 5s ease-in-out infinite}.pill-2{animation:pillFloat2 6s ease-in-out infinite}.pill-3{animation:pillFloat1 5.5s ease-in-out infinite .5s}</style><rect width="1200" height="360" fill="url(#bgGrad)" rx="16"/><g stroke="#38bdf8" stroke-dasharray="4 8" stroke-width="1" class="grid-mesh"><line x1="80" x2="80" y1="0" y2="360"/><line x1="200" x2="200" y1="0" y2="360"/><line x1="320" x2="320" y1="0" y2="360"/><line x1="440" x2="440" y1="0" y2="360"/><line x1="560" x2="560" y1="0" y2="360"/><line x1="680" x2="680" y1="0" y2="360"/><line x1="800" x2="800" y1="0" y2="360"/><line x1="920" x2="920" y1="0" y2="360"/><line x1="1040" x2="1040" y1="0" y2="360"/><line x1="0" x2="1200" y1="60" y2="60"/><line x1="0" x2="1200" y1="120" y2="120"/><line x1="0" x2="1200" y1="180" y2="180"/><line x1="0" x2="1200" y1="240" y2="240"/><line x1="0" x2="1200" y1="300" y2="300"/></g><circle cx="980" cy="190" r="140" fill="#38bdf8" filter="url(#glow)" opacity=".08"/><circle cx="1100" cy="90" r="100" fill="#a855f7" filter="url(#glow)" opacity=".08"/><g class="actuarial-curve" opacity=".75"><path fill="url(#glowGrad)" d="M 660 310 Q 760 270, 840 290 T 960 210 T 1080 140 T 1160 100 L 1160 310 Z"/><path fill="none" stroke="#38bdf8" stroke-linecap="round" stroke-width="3" d="M 660 310 Q 760 270, 840 290 T 960 210 T 1080 140 T 1160 100"/><path fill="none" stroke="url(#accentPurple)" stroke-dasharray="6 4" stroke-linecap="round" stroke-width="2.5" d="M 680 320 Q 800 240, 910 250 T 1030 160 T 1160 70"/></g><circle cx="840" cy="290" r="4" fill="#38bdf8" class="node-1"/><circle cx="960" cy="210" r="5" fill="#60a5fa" class="node-2"/><circle cx="1080" cy="140" r="4.5" fill="#c084fc" class="node-3"/><circle cx="1160" cy="70" r="5" fill="#f472b6" class="node-4"/><g class="pill-1" filter="url(#cardShadow)" transform="translate(680, 50)"><rect width="145" height="32" fill="#1e293b" stroke="#334155" stroke-width="1.2" rx="16"/><circle cx="16" cy="16" r="4" fill="#10b981"/><text x="28" y="20" class="badge-text">P&amp;C RESERVING</text></g><g class="pill-2" filter="url(#cardShadow)" transform="translate(845, 40)"><rect width="155" height="32" fill="#1e293b" stroke="#334155" stroke-width="1.2" rx="16"/><circle cx="16" cy="16" r="4" fill="#38bdf8"/><text x="28" y="20" class="badge-text">PRICING ENGINES</text></g><g class="pill-3" filter="url(#cardShadow)" transform="translate(1020, 55)"><rect width="135" height="32" fill="#1e293b" stroke="#334155" stroke-width="1.2" rx="16"/><circle cx="16" cy="16" r="4" fill="#f59e0b"/><text x="28" y="20" class="badge-text">CAT &amp; CYBER RQ</text></g><g transform="translate(70, 75)"><rect width="195" height="26" fill="#1e293b" stroke="#38bdf8" stroke-width="1" opacity=".9" rx="13"/><text x="14" y="17" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1">CURATED ACTUARIAL ECOSYSTEM</text><text x="0" y="70" class="title-text" font-size="38">Autonomous Actuarial &amp;</text><text x="0" y="118" fill="url(#accentCyan)" class="title-text" font-size="38">Risk Advisory Systems</text><text x="0" y="160" class="subtitle-text" font-size="16">Curated Catalog of Enterprise SaaS &amp; Open-Source Risk Intelligence</text><text x="0" y="186" fill="#64748b" class="subtitle-text" font-size="13.5">Loss Reserving • Pricing Optimization • Catastrophe Modeling • Cyber Risk Quantification</text><g transform="translate(0, 215)"><rect width="105" height="24" fill="#0f172a" stroke="#1e293b" stroke-width="1" rx="6"/><text x="12" y="16" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">📊 Actuarial AI</text><rect width="1