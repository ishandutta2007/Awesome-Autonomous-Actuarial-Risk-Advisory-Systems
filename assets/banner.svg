<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45" />
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 11px;
      font-weight: 600;
      fill: #e2e8f0;
      letter-spacing: 0.5px;
    }

    /* Subtle background grid pulse */
    @keyframes gridPulse {
      0%, 100% { opacity: 0.12; }
      50% { opacity: 0.22; }
    }
    .grid-mesh {
      animation: gridPulse 8s ease-in-out infinite;
    }

    /* Flowing actuarial wave curve */
    @keyframes waveFloat {
      0% { transform: translateY(0px) scaleY(1); }
      50% { transform: translateY(-8px) scaleY(1.05); }
      100% { transform: translateY(0px) scaleY(1); }
    }
    .actuarial-curve {
      animation: waveFloat 6s ease-in-out infinite;
      transform-origin: center bottom;
    }

    /* Dynamic particle and node motion */
    @keyframes pulseNode {
      0%, 100% { r: 4px; opacity: 0.4; }
      50% { r: 6px; opacity: 0.95; }
    }
    .node-1 { animation: pulseNode 3.5s ease-in-out infinite; }
    .node-2 { animation: pulseNode 4.2s ease-in-out infinite 1s; }
    .node-3 { animation: pulseNode 3s ease-in-out infinite 2s; }
    .node-4 { animation: pulseNode 5s ease-in-out infinite 1.5s; }

    /* Pill badge gentle floating */
    @keyframes pillFloat1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }
    @keyframes pillFloat2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(5px); }
    }
    .pill-1 { animation: pillFloat1 5s ease-in-out infinite; }
    .pill-2 { animation: pillFloat2 6s ease-in-out infinite; }
    .pill-3 { animation: pillFloat1 5.5s ease-in-out infinite 0.5s; }
  </style>

  <!-- Canvas Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Background Animated Coordinate / Actuarial Grid -->
  <g class="grid-mesh" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 8">
    <line x1="80" y1="0" x2="80" y2="360" />
    <line x1="200" y1="0" x2="200" y2="360" />
    <line x1="320" y1="0" x2="320" y2="360" />
    <line x1="440" y1="0" x2="440" y2="360" />
    <line x1="560" y1="0" x2="560" y2="360" />
    <line x1="680" y1="0" x2="680" y2="360" />
    <line x1="800" y1="0" x2="800" y2="360" />
    <line x1="920" y1="0" x2="920" y2="360" />
    <line x1="1040" y1="0" x2="1040" y2="360" />
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
  </g>

  <!-- Ambient Glow Behind Graph Elements -->
  <circle cx="980" cy="190" r="140" fill="#38bdf8" opacity="0.08" filter="url(#glow)" />
  <circle cx="1100" cy="90" r="100" fill="#a855f7" opacity="0.08" filter="url(#glow)" />

  <!-- Dynamic Actuarial Loss Curves & Stochastic Distributions (Placed in Background / Right Flank) -->
  <g class="actuarial-curve" opacity="0.75">
    <!-- Shaded Area Under Stochastic Curve -->
    <path d="M 660 310 Q 760 270, 840 290 T 960 210 T 1080 140 T 1160 100 L 1160 310 Z" fill="url(#glowGrad)" />
    <!-- Secondary Trend Curve -->
    <path d="M 660 310 Q 760 270, 840 290 T 960 210 T 1080 140 T 1160 100" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
    <!-- Primary Exceedance Curve -->
    <path d="M 680 320 Q 800 240, 910 250 T 1030 160 T 1160 70" fill="none" stroke="url(#accentPurple)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6 4" />
  </g>

  <!-- Dynamic Animated Graph Nodes -->
  <circle cx="840" cy="290" r="4" fill="#38bdf8" class="node-1" />
  <circle cx="960" cy="210" r="5" fill="#60a5fa" class="node-2" />
  <circle cx="1080" cy="140" r="4.5" fill="#c084fc" class="node-3" />
  <circle cx="1160" cy="70" r="5" fill="#f472b6" class="node-4" />

  <!-- Floating Feature Pills (Placed in Safe Space to avoid obscuring header text) -->
  <g class="pill-1" transform="translate(680, 50)" filter="url(#cardShadow)">
    <rect width="145" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
    <circle cx="16" cy="16" r="4" fill="#10b981" />
    <text x="28" y="20" class="badge-text">P&amp;C RESERVING</text>
  </g>

  <g class="pill-2" transform="translate(845, 40)" filter="url(#cardShadow)">
    <rect width="155" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
    <circle cx="16" cy="16" r="4" fill="#38bdf8" />
    <text x="28" y="20" class="badge-text">PRICING ENGINES</text>
  </g>

  <g class="pill-3" transform="translate(1020, 55)" filter="url(#cardShadow)">
    <rect width="135" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
    <circle cx="16" cy="16" r="4" fill="#f59e0b" />
    <text x="28" y="20" class="badge-text">CAT &amp; CYBER RQ</text>
  </g>

  <!-- FOREGROUND: Main Title, Subtitle, and Description (Always Clear & Prominent) -->
  <g transform="translate(70, 75)">
    <!-- Small Category Label / Super-heading -->
    <rect width="195" height="26" rx="13" fill="#1e293b" stroke="#38bdf8" stroke-width="1" opacity="0.9" />
    <text x="14" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="1">CURATED ACTUARIAL ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="0" y="70" class="title-text" font-size="38">
      Autonomous Actuarial &amp;
    </text>
    <text x="0" y="118" class="title-text" font-size="38" fill="url(#accentCyan)">
      Risk Advisory Systems
    </text>

    <!-- Subtitle / Mission Statement -->
    <text x="0" y="160" class="subtitle-text" font-size="16">
      Curated Catalog of Enterprise SaaS &amp; Open-Source Risk Intelligence
    </text>
    <text x="0" y="186" class="subtitle-text" font-size="13.5" fill="#64748b">
      Loss Reserving • Pricing Optimization • Catastrophe Modeling • Cyber Risk Quantification
    </text>

    <!-- Meta highlights / Tags -->
    <g transform="translate(0, 215)">
      <rect width="105" height="24" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <text x="12" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">📊 Actuarial AI</text>

      <rect x="115" width="130" height="24" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <text x="127" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">⚡ Real-Time Rating</text>

      <rect x="255" width="125" height="24" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <text x="267" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">🛡️ Open Cat &amp; CRQ</text>
    </g>
  </g>
</svg>
